<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Root's — Catálogo de productos</title>
<meta name="description" content="Catálogo de productos Root's: condimentos, salsas, sacos y conservas. Arma tu pedido y envíalo por WhatsApp.">
<meta name="theme-color" content="#E6F2DE">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<nav class="cats" id="app-cats" aria-label="Categorías"></nav>

<script src="js/config.js"></script>
