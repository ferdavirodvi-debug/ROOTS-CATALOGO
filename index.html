<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Root's — Catálogo</title>
<meta name="description" content="Catálogo de productos Root's: condimentos, salsas, conservas y más.">
<style>
  :root { --bg:#ffffff; --ink:#1f2a1f; --soft:#5c6b5c; --green:#2f9e44; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111611; --ink:#eef4ee; --soft:#a9b8a9; --green:#51cf66; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; text-align:center; }
  h1 { font-size:clamp(2.2rem,8vw,3.5rem); margin:0 0 8px; letter-spacing:-0.02em; }
  h1 span { color:var(--green); }
  p { margin:0; color:var(--soft); font-size:1.15rem; }
</style>
</head>
<body>
  <main>
    <h1>Root<span>’s</span></h1>
    <p>Nuestro catálogo llega muy pronto.</p>
  </main>
</body>
</html>
