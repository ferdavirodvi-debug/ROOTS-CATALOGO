<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Root's — Panel de precios</title>
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Glory:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">

<main class="admin-login" id="login">
  <img src="img/logo.svg" alt="Root's" width="180" height="56">
  <h1>Panel de precios</h1>
  <form id="login-form" autocomplete="off">
    <label for="pw">Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p class="field-error" id="login-error" role="alert" hidden>Contraseña incorrecta.</p>
    <button class="btn" id="login-btn" type="submit">Entrar</button>
  </form>
  <p class="admin-hint"><a href="./">← Volver al catálogo</a></p>
</main>

<div id="panel" hidden>
  <header class="admin-head">
    <div class="admin-head-in">
      <img src="img/logo.svg" alt="Root's" width="120" height="38">
      <h1>Panel de precios</h1>
      <div class="search" role="search">
        <input type="search" id="filter" placeholder="Filtrar por nombre o código" aria-label="Filtrar productos" autocomplete="off">
      </div>
      <a class="admin-back" href="./">Ver catálogo</a>
    </div>
  </header>

  <p class="admin-note" id="admin-load-error" role="alert" hidden></p>
  <div class="admin-list" id="list"></div>

  <div class="admin-bar">
    <span id="status" role="status" aria-live="polite"></span>
    <button class="btn" id="save" type="button" disabled>Guardar cambios</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="data/products.js"></script>
<script src="js/search.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
